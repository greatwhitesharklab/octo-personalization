[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octo-personalization"
version = "0.1.0"
description = "Per-customer personalization over external memory for a frozen small LM: mechanism lever + reproducible benchmark + data-flywheel plumbing (open glue; the moat is your data)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
    "transformers>=4.45",
]

[project.optional-dependencies]
bkv = ["huamao-bkv"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["octo*"]
